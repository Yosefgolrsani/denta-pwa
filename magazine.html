<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#174b43">
<title>مجله دنتا | مقاله‌های سلامت دهان و دندان</title><meta name="description" content="مقاله‌ها و راهنماهای آموزشی دنتا درباره سلامت دهان و دندان و آشنایی با خدمات دندان‌پزشکی.">
<link rel="canonical" href="https://denta-clinic.ir/magazine">
<style>
:root{--ink:#172d2b;--muted:#73817b;--green:#174b43;--gold:#b99558;--cream:#f7f5ef;--line:#e8e4d9}
*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font:15px/2 Tahoma,Arial,sans-serif}
header{background:#fff;border-bottom:1px solid var(--line);padding:16px 5%;display:flex;justify-content:space-between;gap:12px;align-items:center}
a{color:var(--green);text-decoration:none}main{max-width:1050px;margin:30px auto;padding:0 18px}
#list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
article,.paper{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px;overflow:hidden}
article img,.cover{width:100%;max-height:260px;object-fit:cover;border-radius:12px}
h1,h2{color:var(--green)}.muted{color:var(--muted)}.bodycopy{white-space:pre-wrap;line-height:2.2}
#detail{display:none}.back{display:inline-block;margin-bottom:16px}
@media(max-width:700px){#list{grid-template-columns:1fr}header{flex-wrap:wrap}}
</style></head>
<body><header><strong>DENTA | مجله دنتا</strong><nav><a href="/">صفحه اصلی</a>　<a href="/about">درباره ما</a></nav></header>
<main><section id="listing"><p class="muted">مجله دنتا</p><h1>مقاله‌ها و راهنماهای دنتا</h1><p class="muted">مطالب آموزشی برای آشنایی بیشتر با سلامت دهان و دندان.</p><div id="list">در حال دریافت مقاله‌ها...</div></section>
<section id="detail"><a class="back" href="/magazine">← بازگشت به مجله</a><article class="paper"><img id="cover" class="cover" alt="" hidden><h1 id="title"></h1><p id="excerpt" class="muted"></p><div id="content" class="bodycopy"></div><p id="date" class="muted"></p></article></section>
</main>
<script>
async function load(){
 const list=document.getElementById('list');
 try{
  const cfg=await fetch('/api/config',{cache:'no-store'}).then(r=>r.json());
  if(!cfg.supabaseUrl||!cfg.supabaseKey)throw new Error('اتصال دنتا آماده نیست.');
  const base=cfg.supabaseUrl.replace(/\/$/,'')+'/rest/v1/denta_articles?select=title,slug,excerpt,content,cover_image_url,seo_title,seo_description,published_at&status=eq.published&order=published_at.desc';
  const res=await fetch(base,{headers:{apikey:cfg.supabaseKey,Authorization:'Bearer '+cfg.supabaseKey}});
  if(!res.ok)throw new Error('دریافت مقاله‌ها با مشکل روبه‌رو شد. ممکن است راه‌اندازی پایگاه داده هنوز انجام نشده باشد.');
  const rows=await res.json(),slug=new URLSearchParams(location.search).get('slug');
  if(slug){
   const a=rows.find(x=>x.slug===slug);
   if(!a){list.textContent='این مقاله پیدا نشد یا هنوز منتشر نشده است.';return}
   document.getElementById('listing').style.display='none';document.getElementById('detail').style.display='block';
   document.title=(a.seo_title||a.title)+' | مجله دنتا';
   document.querySelector('meta[name="description"]').content=a.seo_description||a.excerpt||a.title;
   document.getElementById('title').textContent=a.title;document.getElementById('excerpt').textContent=a.excerpt||'';
   document.getElementById('content').textContent=a.content;
   if(a.cover_image_url){const im=document.getElementById('cover');im.src=a.cover_image_url;im.alt=a.title;im.hidden=false}
   if(a.published_at)document.getElementById('date').textContent=new Intl.DateTimeFormat('fa-IR',{dateStyle:'long'}).format(new Date(a.published_at));
   return;
  }
  if(!rows.length){list.textContent='هنوز مقاله‌ای منتشر نشده است. به‌زودی مطالب آموزشی دنتا در این بخش قرار می‌گیرند.';return}
  list.replaceChildren();
  rows.forEach(a=>{const card=document.createElement('article');
   if(a.cover_image_url){const im=document.createElement('img');im.src=a.cover_image_url;im.alt=a.title;im.loading='lazy';card.appendChild(im)}
   const h=document.createElement('h2');h.textContent=a.title;card.appendChild(h);
   const p=document.createElement('p');p.className='muted';p.textContent=a.excerpt||'';card.appendChild(p);
   const link=document.createElement('a');link.href='/magazine?slug='+encodeURIComponent(a.slug);link.textContent='ادامه مقاله ←';card.appendChild(link);list.appendChild(card);
  });
 }catch(e){list.textContent=e.message}
}
load();
</script></body></html>
