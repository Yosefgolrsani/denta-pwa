<!doctype html>
<html lang="fa" dir="rtl">
<head>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#123c58">
<title>اخبار پزشکی و دندان‌پزشکی | دنتا</title>
<meta name="description" content="آخرین اخبار دندان‌پزشکی، فناوری‌های درمانی، پژوهش‌های علمی و رویدادهای سلامت دهان و دندان در دنتا.">
<meta name="robots" content="index,follow,max-image-preview:large">
<link rel="canonical" href="https://denta-clinic.ir/news">
<meta property="og:site_name" content="دنتا"><meta property="og:title" content="اخبار پزشکی و دندان‌پزشکی | دنتا">
<meta property="og:description" content="خبرهای تازه دندان‌پزشکی با ذکر منبع معتبر."><meta property="og:url" content="https://denta-clinic.ir/news">
<style>
@import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap');
:root{--navy:#123c58;--blue:#17617c;--gold:#c6a15b;--ink:#18344b;--muted:#718096;--line:#e2eaf2}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#f5f9fd,#edf4f9);color:var(--ink);font:15px/2 Vazirmatn,Tahoma,Arial,sans-serif}
header{background:#fff;border-bottom:1px solid var(--line);padding:14px 5%;display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:0;z-index:3}
header strong{font-size:19px;color:var(--navy)}nav{display:flex;gap:18px;flex-wrap:wrap}a{color:var(--blue);text-decoration:none;font-weight:700}
main{max-width:1120px;margin:35px auto;padding:0 18px}
.hero{background:linear-gradient(120deg,#123c58,#1a6078);border-radius:25px;padding:30px;color:#fff;margin-bottom:26px}
.hero small{color:#e6cc98}.hero h1{font-size:clamp(25px,4vw,36px);margin:7px 0}.hero p{color:#e4eef4;margin:0}
#newsList{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.news-card,.detail{background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:0 12px 30px #123c580c;overflow:hidden}
.news-card img{width:100%;height:190px;object-fit:cover;border-radius:14px}
.news-card h2{font-size:18px;line-height:1.8;margin:10px 0 5px;color:var(--navy)}
.news-card p{color:var(--muted);font-size:13px;line-height:2}
.meta{font-size:11px;color:#8a98a7}.tag{display:inline-block;background:#edf5f8;color:#27647c;padding:3px 10px;border-radius:30px;font-size:11px}
.more{display:inline-block;margin-top:8px;padding:8px 14px;border-radius:10px;background:#eaf3f8}
#detail{display:none}.detail{padding:clamp(18px,4vw,36px)}.detail img{width:100%;max-height:420px;object-fit:cover;border-radius:16px}.detail h1{font-size:clamp(24px,4vw,34px);color:var(--navy)}.bodycopy{white-space:pre-wrap;line-height:2.4;font-size:16px}
.source{margin-top:25px;padding:14px;background:#f5f8fb;border-radius:12px;font-size:13px}
@media(max-width:760px){#newsList{grid-template-columns:1fr}header{flex-wrap:wrap}main{margin:22px auto;padding:0 14px}.news-card img{height:210px}}
</style></head>
<body><header><strong>DENTA | اخبار دنتا</strong><nav><a href="/home">صفحه اصلی</a><a href="/magazine">مجله دنتا</a><a href="/about">درباره ما</a></nav></header>
<main>
<section class="hero" id="listing"><small>اخبار و تازه‌های پزشکی</small><h1>آخرین اخبار دندان‌پزشکی و سلامت دهان</h1><p>خبرهای علمی، فناوری‌های درمانی و رویدادهای پزشکی؛ همراه با ذکر منبع و تاریخ انتشار.</p></section>
<div id="newsList">در حال دریافت خبرها...</div>
<section id="detail"><a href="/news">← بازگشت به اخبار</a><article class="detail"><span id="category" class="tag"></span><h1 id="title"></h1><p id="summary" class="meta"></p><img id="cover" hidden alt=""><div id="content" class="bodycopy"></div><div id="source" class="source"></div><p id="date" class="meta"></p></article></section>
</main>
<script>
async function loadNews(){
 const list=document.getElementById('newsList');
 try{
  const cfg=await fetch('/api/config',{cache:'no-store'}).then(r=>r.json());
  const url=cfg.supabaseUrl.replace(/\/$/,'')+'/rest/v1/denta_news?select=title,slug,summary,content,cover_image_url,category,source_name,source_url,published_at&status=eq.published&order=published_at.desc';
  const res=await fetch(url,{headers:{apikey:cfg.supabaseKey,Authorization:'Bearer '+cfg.supabaseKey}});
  if(!res.ok)throw new Error('دریافت اخبار انجام نشد. اتصال پایگاه داده را بررسی کنید.');
  const rows=await res.json(),slug=new URLSearchParams(location.search).get('slug');
  if(slug){
   const n=rows.find(x=>x.slug===slug);document.getElementById('listing').style.display='none';
   if(!n){list.textContent='این خبر پیدا نشد یا منتشر نشده است.';return}
   document.getElementById('detail').style.display='block';document.title=n.title+' | اخبار دنتا';
   document.querySelector('link[rel="canonical"]').href=location.origin+'/news?slug='+encodeURIComponent(n.slug);
   document.querySelector('meta[name="description"]').content=n.summary||n.title;
   document.getElementById('category').textContent=n.category||'دندان‌پزشکی';
   document.getElementById('title').textContent=n.title;document.getElementById('summary').textContent=n.summary||'';
   document.getElementById('content').textContent=n.content;
   if(n.cover_image_url){const im=document.getElementById('cover');im.src=n.cover_image_url;im.alt=n.title;im.hidden=false}
   const src=document.getElementById('source');const a=document.createElement('a');a.href=n.source_url;a.target='_blank';a.rel='noopener noreferrer';a.textContent=n.source_name+' — مشاهده منبع اصلی';src.append('منبع خبر: ',a);
   if(n.published_at)document.getElementById('date').textContent=new Intl.DateTimeFormat('fa-IR',{dateStyle:'long'}).format(new Date(n.published_at));
   return;
  }
  if(!rows.length){list.textContent='هنوز خبری منتشر نشده است. خبرهای بررسی‌شده به‌زودی در این بخش قرار می‌گیرند.';return}
  list.replaceChildren();
  rows.forEach(n=>{const card=document.createElement('article');card.className='news-card';
   if(n.cover_image_url){const im=document.createElement('img');im.src=n.cover_image_url;im.alt=n.title;im.loading='lazy';card.appendChild(im)}
   const tag=document.createElement('span');tag.className='tag';tag.textContent=n.category||'دندان‌پزشکی';card.appendChild(tag);
   const h=document.createElement('h2');h.textContent=n.title;card.appendChild(h);
   const p=document.createElement('p');p.textContent=n.summary||'';card.appendChild(p);
   const meta=document.createElement('div');meta.className='meta';meta.textContent='منبع: '+n.source_name;card.appendChild(meta);
   const link=document.createElement('a');link.className='more';link.href='/news?slug='+encodeURIComponent(n.slug);link.textContent='ادامه خبر ←';card.appendChild(link);list.appendChild(card);
  });
 }catch(e){list.textContent=e.message}
}
loadNews();
</script></body></html>
